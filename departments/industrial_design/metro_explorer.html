function renderDestination(d){const box=$('#detail');const names=d.required_line_ids.map(id=>lineById[id]?.name).filter(Boolean);box.innerHTML=`<h3>${esc(d.title)}</h3><div class="tags"><span class="tag">${d.has_104_market_evidence?'104 市場已觀察':'CIP–SOC 探索'}</span><span class="tag">${esc(d.career_stage_label||'職涯階段待確認')}</span></div><h4>主要能力線</h4><p>${esc(lineById[d.primary_line_id]?.name)}</p><h4>還需轉乘</h4><ul>${names.slice(1).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>目前沒有其他能力線。</li>'}</ul><h4>104 職稱</h4><p>${esc((d.market_job_titles_104||[]).join('、')||'目前 104 前十職務未觀察')}</p><h4>O*NET 職業</h4><ul>${d.occupations.slice(0,10).map(o=>`<li>${esc(o.title)}｜${esc(o.soc)}</li>`).join('')}</ul><button class="job" id="back-jobs" type="button">返回職涯列表</button>`;$('#back-jobs').onclick=()=>{activeDestination=null;renderDetail();draw()}}
function relationName(v){return({official_prerequisite:'正式先修',official_sequence:'官方課程順序',explicit_learning_prerequisite:'明文學習先備',recommended_knowledge_prerequisite:'建議知識先備'})[v]||v}
function zoom(f){const svg=$('#metro-svg'),b=svg.viewBox.baseVal;if(!b.width)return;const nw=b.width*f,nh=b.height*f;viewBox={x:b.x+(b.width-nw)/2,y:b.y+(b.height-nh)/2,w:nw,h:nh};draw()}
function bindPanZoom(){const host=$('#map-scroll'),svg=$('#metro-svg'),interactive='[data-station],[data-line],[data-destination],[data-more-line]';host.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest?.(interactive))return;const b=svg.viewBox.baseVal;drag={x:e.clientX,y:e.clientY,vx:b.x,vy:b.y,w:b.width,h:b.height};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const rect=svg.getBoundingClientRect();viewBox={x:drag.vx-(e.clientX-drag.x)*drag.w/rect.width,y:drag.vy-(e.clientY-drag.y)*drag.h/rect.height,w:drag.w,h:drag.h};svg.setAttribute('viewBox',`${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`)});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null)}
setup();
</script><script src="career_metro_data.js"></script><script src="../../metro_drag.js"></script></body></html>
