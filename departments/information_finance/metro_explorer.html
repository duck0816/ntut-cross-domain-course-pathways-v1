function renderDetail(){const box=$('#detail');if(selectedStation){const s=selectedStation,lines=s.line_ids.map(id=>lineById[id]?.name).filter(Boolean),crossLines=s.line_ids.filter(id=>lineById[id]?.line_type==='cross_domain'),deps=DATA.dependencies.filter(e=>e.from_station_id===s.station_id||e.to_station_id===s.station_id),alts=DATA.alternatives.filter(a=>s.line_ids.includes(a.scoped_skill_id));box.innerHTML=`<h3>${esc(s.name_zh)}</h3><div class="tags"><span class="tag">${esc(s.course_code||'課程缺口')}</span><span class="tag">${esc(s.credits??'—')} 學分</span><span class="tag">${esc(s.position?.label||'位置待確認')}</span>${crossLines.length>1?'<span class="tag">共用課程／轉乘站</span>':''}</div><h4>開課與能力</h4><p>${esc((s.department_names||[]).join('／')||'目前沒有對應課程')}<br>${esc(lines.join('、'))}</p><h4>位置來源</h4><p>${esc(s.position?.source_label||'位置待確認')} · ${esc(s.position?.status||'未解析')}<br>最近開課：${esc(s.availability?.latest_term||'未觀察')}</p><h4>被選入的理由</h4><ul>${(s.selection_reasons||[]).slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>由先備閉包納入。</li>'}</ul><h4>先備關係</h4><ul>${deps.map(e=>`<li>${esc(stationById[e.from_station_id]?.name_zh)} → ${esc(stationById[e.to_station_id]?.name_zh)}｜${esc(relationName(e.relation))}${e.timing_status==='reverse_observed_position'?'｜位置反向':''}</li>`).join('')||'<li>目前沒有辨識到相鄰先備。</li>'}</ul><h4>同能力線替代課</h4><ul>${alts.slice(0,8).map(a=>`<li>${esc(a.name_zh)}（${esc(a.department_name)}）</li>`).join('')||'<li>目前沒有另列替代課。</li>'}</ul>`;return}const jobs=DATA.destinations.filter(sourceMatch).filter(d=>activeLine==='all'||d.required_line_ids.includes(activeLine)),transfers=DATA.stations.filter(s=>s.line_ids.filter(id=>lineById[id]?.line_type==='cross_domain').length>1);const overlap=transfers.length?`辨識到 ${transfers.length} 門共用主課；彩色能力線會在這些轉乘站交會。`:'目前主路徑沒有辨識到跨能力共用課程，因此能力線不會為了視覺效果刻意交會。';box.innerHTML=`<h3>${activeLine==='all'?'職涯目的地':esc(lineById[activeLine]?.name)}</h3><div class="overlap-note"><b>能力重疊怎麼看</b><br>${esc(overlap)}</div><p>選擇職涯後，圖上會同時高亮它需要的核心與支援能力線。</p><div class="jobs">${jobs.map(d=>`<button class="job ${activeDestination?.destination_id===d.destination_id?'active':''}" data-job="${esc(d.destination_id)}"><b>${esc(d.title)}</b><small>${d.has_104_market_evidence?'104 市場已觀察':'CIP–SOC 探索'} · 需 ${d.required_line_ids.length} 條能力線</small></button>`).join('')||'<div class="empty">目前篩選條件下沒有職涯方向。</div>'}</div>`;box.querySelectorAll('[data-job]').forEach(el=>el.onclick=()=>{activeDestination=DATA.destinations.find(d=>d.destination_id===el.dataset.job);selectedStation=null;renderDestination(activeDestination);draw()})}
function renderDestination(d){const box=$('#detail');const names=d.required_line_ids.map(id=>lineById[id]?.name).filter(Boolean);box.innerHTML=`<h3>${esc(d.title)}</h3><div class="tags"><span class="tag">${d.has_104_market_evidence?'104 市場已觀察':'CIP–SOC 探索'}</span><span class="tag">${esc(d.career_stage_label||'職涯階段待確認')}</span></div><h4>主要能力線</h4><p>${esc(lineById[d.primary_line_id]?.name)}</p><h4>還需轉乘</h4><ul>${names.slice(1).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>目前沒有其他能力線。</li>'}</ul><h4>104 職稱</h4><p>${esc((d.market_job_titles_104||[]).join('、')||'目前 104 前十職務未觀察')}</p><h4>O*NET 職業</h4><ul>${d.occupations.slice(0,10).map(o=>`<li>${esc(o.title)}｜${esc(o.soc)}</li>`).join('')}</ul><button class="job" id="back-jobs" type="button">返回職涯列表</button>`;$('#back-jobs').onclick=()=>{activeDestination=null;renderDetail();draw()}}
function relationName(v){return({official_prerequisite:'正式先修',official_sequence:'官方課程順序',explicit_learning_prerequisite:'明文學習先備',recommended_knowledge_prerequisite:'建議知識先備'})[v]||v}
function zoom(f){const svg=$('#metro-svg'),b=svg.viewBox.baseVal;if(!b.width)return;const nw=b.width*f,nh=b.height*f;viewBox={x:b.x+(b.width-nw)/2,y:b.y+(b.height-nh)/2,w:nw,h:nh};draw()}
function bindPanZoom(){const host=$('#map-scroll'),svg=$('#metro-svg'),interactive='[data-station],[data-line],[data-destination],[data-more-line]';host.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest?.(interactive))return;const b=svg.viewBox.baseVal;drag={x:e.clientX,y:e.clientY,vx:b.x,vy:b.y,w:b.width,h:b.height};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const rect=svg.getBoundingClientRect();viewBox={x:drag.vx-(e.clientX-drag.x)*drag.w/rect.width,y:drag.vy-(e.clientY-drag.y)*drag.h/rect.height,w:drag.w,h:drag.h};svg.setAttribute('viewBox',`${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`)});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null)}
setup();
</script><script src="career_metro_data.js"></script><script src="../../metro_drag.js"></script></body></html>
