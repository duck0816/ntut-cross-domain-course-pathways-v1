</style></head><body><div class="wrap"><header class="hero"><div><div class="kicker">MARKET → SKILLS → COURSES → PREREQUISITES</div><h1>市場職業驅動的<br>工業／管理跨域路徑</h1><p>路徑不是預先指定。候選職業來自 104、工業／管理相關 CIP–SOC 與 O*NET 相關職業；再依共同技能缺口分群，尋找本校可補足的課程與實際先備。</p></div><div class="method-stamp"><b id="method-count"></b><span>選一條路徑，先看市場職業與必備技能，再檢查課程及八學期位置。</span></div></header><div class="layout"><aside class="side"><h2>資料產生的候選路徑</h2><p>清單顯示合併後的修課路徑；只有能力、分級、主課與完整先備都相同的職業入口才會合併。</p><label class="source-filter-label" for="source-filter">市場證據</label><select id="source-filter" class="source-filter"><option value="all">全部共同能力路徑</option><option value="104_market_observed">含 104 市場證據</option><option value="cip_soc_exploratory">僅 CIP–SOC 探索</option></select><div id="route-list" class="route-list"></div></aside><main id="main" class="main"></main></div></div><script>const DATA={"title":"市場職業驅動的工業工程與管理系跨域候選路徑","method_version":"department-market-v1.1-unlimited-cross-domain-skills","scope":{"department":"工業工程與管理系／dept:37","entry_year":115,"market_sources":["104 工業工程與管理系前十職務","工業工程與管理系相關 CIP–SOC","O*NET 29.3 Primary related occupations"],"route_generation":"先保留每個104職務與直接CIP–SOC為職業入口，再將本科底座、完整跨域能力與分級、主課及遞迴先備完全相同者合併為共同能力路徑。","course_mapping":"職業證據經工業工程與管理系能力中介層正規化；本系課程作底座、外系課程補跨域能力，再由全校關聯底圖遞迴補先備。","availability":"課程位置先採開課系所115課程規則；沒有時採110-1至115-1最近實際開課；都沒有則位置待確認。","degree_policy":"候選池排除可辨識的研究所課程與明列限制外系修課者；Job Zone 5不進入大學部主路徑。"},"configuration_provenance":{"status":"ai_draft","note":"依工業工程與管理系 104 前十職務、系所候選 CIP–SOC 範圍與 O*NET 元素、任務、技術欄位建立；尚未經該系課程專家審查。"},"data_sources":[{"role":"Taiwan market entry","source":"104 工業工程與管理系前十職務","path":"data\\raw\\104職業技能\\104_ntut_top10_skills.json"},{"role":"occupation evidence","source":"O*NET 29.3","path":"C:\\Users\\user\\Desktop\\projects\\onet_data\\db_29_3_excel"},{"role":"program-to-occupation prior","source":"CIP 2020–SOC crosswalk","path":"C:\\Users\\user\\Desktop\\projects\\job_course\\CIP_to_SOC\\merged_crosswalk_all_skills.csv"},{"role":"course concepts, pre
