</style></head><body><div class="wrap"><header class="hero"><div><div class="kicker">MARKET → SKILLS → COURSES → PREREQUISITES</div><h1>市場職業驅動的<br>經營管理跨域路徑</h1><p>路徑不是預先指定。候選職業來自 104、經營管理相關 CIP–SOC 與 O*NET 相關職業；再依共同技能缺口分群，尋找本校可補足的課程與實際先備。</p></div><div class="method-stamp"><b id="method-count"></b><span>選一條路徑，先看市場職業與必備技能，再檢查課程及八學期位置。</span></div></header><div class="layout"><aside class="side"><h2>資料產生的候選路徑</h2><p>清單顯示合併後的修課路徑；只有能力、分級、主課與完整先備都相同的職業入口才會合併。</p><label class="source-filter-label" for="source-filter">市場證據</label><select id="source-filter" class="source-filter"><option value="all">全部共同能力路徑</option><option value="104_market_observed">含 104 市場證據</option><option value="cip_soc_exploratory">僅 CIP–SOC 探索</option></select><div id="route-list" class="route-list"></div></aside><main id="main" class="main"></main></div></div><script>const DATA={"title":"市場職業驅動的經營管理系跨域候選路徑","method_version":"department-market-v1.1-unlimited-cross-domain-skills","scope":{"department":"經營管理系／dept:57","entry_year":115,"market_sources":["104 經營管理系前十職務","經營管理系相關 CIP–SOC","O*NET 29.3 Primary related occupations"],"route_generation":"先保留每個104職務與直接CIP–SOC為職業入口，再將本科底座、完整跨域能力與分級、主課及遞迴先備完全相同者合併為共同能力路徑。","course_mapping":"職業證據經經營管理系能力中介層正規化；本系課程作底座、外系課程補跨域能力，再由全校關聯底圖遞迴補先備。","availability":"課程位置先採開課系所115課程規則；沒有時採110-1至115-1最近實際開課；都沒有則位置待確認。","degree_policy":"候選池排除可辨識的研究所課程與明列限制外系修課者；Job Zone 5不進入大學部主路徑。"},"configuration_provenance":{"status":"ai_draft","note":"依經營管理系 104 前十職務、系所候選 CIP–SOC 範圍與 O*NET 元素、任務、技術欄位建立；尚未經該系課程專家審查。"},"data_sources":[{"role":"Taiwan market entry","source":"104 經營管理系前十職務","path":"data\\raw\\104職業技能\\104_ntut_top10_skills.json"},{"role":"occupation evidence","source":"O*NET 29.3","path":"C:\\Users\\user\\Desktop\\projects\\onet_data\\db_29_3_excel"},{"role":"program-to-occupation prior","source":"CIP 2020–SOC crosswalk","path":"C:\\Users\\user\\Desktop\\projects\\job_course\\CIP_to_SOC\\merged_crosswalk_all_skills.csv"},{"role":"course concepts, prerequisites and semester   const lanes=Array.from({length:8},()=>[]);for(const n of r.timeline_nodes||[])if(n.term)lanes[n.term-1].push(n);
  const timeline=lanes.map((nodes,i)=>`<div class="semester"><h4>${terms[i]}</h4>${nodes.map(coverageNodeHtml).join('')}</div>`).join('');
  const byCode=Object.fromEntries((r.timeline_nodes||[]).map(n=>[n.course_code,n]));
  const relationChips=(r.timeline_edges||[]).map(e=>{const a=byCode[e.from_code],b=byCode[e.to_code];return `<span class="relation-chip ${e.relation==='recommended_knowledge_prerequisite'?'recommended':''}">${esc(relationName(e.relation))}：${esc(a?.name_zh||e.from_code)} → ${esc(b?.name_zh||e.to_code)}</span>`}).join('');
  const unplaced=(r.timeline_nodes||[]).filter(n=>!n.term);
  const jobs104=(r.market_job_titles_104||[]).map(x=>`<span class="market-job">104：${esc(x)}</span>`).join('');
  const onet=(r.occupations||[]).slice(0,8).map(x=>`<span class="market-job">O*NET ${esc(x.soc)} ${esc(x.title)}</span>`).join('');
  const memberRoutes=(r.member_routes||[]).map(x=>`<span class="market-job member-job">入口：${esc(x.title)}</span>`).join('');
  const gaps=(r.stages||[]).filter(s=>s.external_extension_status==='course_gap').map(s=>`<div class="gap-item"><b>${esc(s.skill_name)}</b><br>本科未完整涵蓋，且目前校內大學部課程沒有達到候選門檻。</div>`).join('');
  const alternatives=(r.alternative_courses_with_prerequisites||[]).map(a=>{const prereqs=(a.new_prerequisite_courses_vs_main||[]).map(p=>p.name_zh).join('、');return `<article class="alternative-card"><b>${esc(a.name_zh)}</b><small>${esc((a.department_names||[]).join('／')||'開課系所待確認')} · 替代「${esc(a.skill_name_zh)}」</small><p class="cost">若採此方案：正式最低 ${a.formal_course_count_including_targets??'—'} 門；含建議 ${a.recommended_course_count_including_targets??'—'} 門</p><p>${prereqs?'相較主路徑新增先備：'+esc(prereqs):'相較主路徑目前沒有新增先備。'}</p></article>`}).join('');
  const origin=(r.market_job_titles_104||[]).length?`以 104「${esc(r.market_job_titles_104.join('、'))}」為市場入口`:`由相關 CIP–SOC 補出的探索職業入口`;
  document.getElementById('main').innerHTML=`<section class="route-head"><div><h2>${esc(r.title)}</h2><p>${origin}；先由 O*NET／104 證據形成能力需求，再檢查本科涵蓋與跨系補強。</p><span class="career-chip">${esc(r.career_stage_label||'職涯階段待確認')} · ${esc(r.career_stage_note||'')}</span><div class="path-stats"><span class="path-stat">主路徑 ${r.target_course_count} 門</span><span class="path-stat">需跨系補強 ${(r.external_extension_skill_ids||[]).length} 項能力</span><span class="path-stat formal">正式最低 ${r.formal_course_count_including_targets} 門</span><span class="path-stat recommended">含建議 ${r.recommended_course_count_including_targets} 門</span><span class="path-stat">位置待確認 ${r.unplaced_course_count||0} 門</span></div><div class="market-strip">${r.member_route_count>1?memberRoutes:''}${jobs104}${onet}</div></div><div class="route-index">#${String(r.display_order).padStart(2,'0')}</div></section><section class="section"><div class="section-title"><h3>職業能力、本科涵蓋與補強課程</h3><span>課程文字命中只能產生待審候選，不代表達到職業熟練度</span></div><div class="coverage-legend"><span class="complete">本科較完整：僅限明確規則</span><span class="partial">本科部分：仍需補強</span><span class="external">跨系主課</span><span class="gap">校內缺課</span></div><table class="skill-table"><thead><tr><th>能力與優先層級</th><th>市場證據</th><th>本科角色</th><th>本科證據／跨系補強</th></tr></thead><tbody>${skillRows}</tbody></table></section><section class="section"><div class="section-title"><h3>含先備的八學期課程時間軸</h3><span>位置先採開課系所115課規；沒有才採110-1～115-1最近實際開課</span></div><div class="relation-strip">${relationChips||'<span class="relation-chip">目前沒有辨識到課程間先備關係</span>'}</div><div class="timeline-shell"><div class="timeline">${timeline}</div></div>${unplaced.length?`<div class="unplaced"><b>位置待確認，不硬塞入學期</b>${unplaced.map(coverageNodeHtml).join('')}</div>`:''}</section><div id="detail"></div><section class="section"><div class="section-title"><h3>替代方案（不計入主時間軸）</h3><span>每一方案另算自己的遞迴先備</span></div><div class="alternative-grid">${alternatives||'<div class="gap-item">目前沒有替代課程。</div>'}</div></section><section class="section"><div class="section-title"><h3>能力與課程缺口</h3><span>課程覆蓋率只表示已辨識能力有候選課，不是職業資格或能力完成率</span></div><div class="gap-list">${gaps||'<div class="gap-item" style="background:var(--teal-soft);color:#17645d">目前各項能力都有本科完整候選或跨系候選；仍須人工查 syllabus、作業與評量深度。</div>'}</div></section><div class="links"><a href="pathways.json">下載完整 JSON</a><a href="../../course_relationship_foundation/index.html">查看全校課程關聯底圖</a><span>本頁是可追溯的候選分析，不是職業資格認證。</span></div>`;
  document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selected=b.dataset.course;renderDetailV2(r)});
  if(!selected||!(r.timeline_nodes||[]).some(n=>n.course_code===selected))selected=(r.timeline_nodes||[]).find(n=>n.node_type==='external_skill_course')?.course_code||r.timeline_nodes?.[0]?.course_code;
  renderDetailV2(r);
}
