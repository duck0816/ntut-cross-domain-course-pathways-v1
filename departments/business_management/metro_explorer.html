function Counter(items){const out={};items.forEach(x=>out[x]=(out[x]||0)+1);return out}function shorten(v,n){v=String(v||'');return v.length>n?v.slice(0,n-1)+'…':v}
function renderDetail(){const box=$('#detail');if(selectedStation){const s=selectedStation,lines=s.line_ids.map(id=>lineById[id]?.name).filter(Boolean),crossLines=s.line_ids.filter(id=>lineById[id]?.line_type==='cross_domain'),deps=DATA.dependencies.filter(e=>e.from_station_id===s.station_id||e.to_station_id===s.station_id),alts=DATA.alternatives.filter(a=>s.line_ids.includes(a.scoped_skill_id));box.innerHTML=`<h3>${esc(s.name_zh)}</h3><div class="tags"><span class="tag">${esc(s.course_code||'課程缺口')}</span><span class="tag">${esc(s.credits??'—')} 學分</span><span class="tag">${esc(s.position?.label||'位置待確認')}</span>${crossLines.length>1?'<span class="tag">共用課程／轉乘站</span>':''}</div><h4>開課與能力</h4><p>${esc((s.department_names||[]).join('／')||'目前沒有對應課程')}<br>${esc(lines.join('、'))}</p><h4>位置來源</h4><p>${esc(s.position?.source_label||'位置待確認')} · ${esc(s.position?.status||'未解析')}<br>最近開課：${esc(s.availability?.latest_term||'未觀察')}</p><h4>被選入的理由</h4><ul>${(s.selection_reasons||[]).slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>由先備閉包納入。</li>'}</ul><h4>先備關係</h4><ul>${deps.map(e=>`<li>${esc(stationById[e.from_station_id]?.name_zh)} → ${esc(stationById[e.to_station_id]?.name_zh)}｜${esc(relationName(e.relation))}${e.timing_status==='reverse_observed_position'?'｜位置反向':''}</li>`).join('')||'<li>目前沒有辨識到相鄰先備。</li>'}</ul><h4>同能力線替代課</h4><ul>${alts.slice(0,8).map(a=>`<li>${esc(a.name_zh)}（${esc(a.department_name)}）</li>`).join('')||'<li>目前沒有另列替代課。</li>'}</ul>`;return}const jobs=DATA.destinations.filter(sourceMatch).filter(d=>activeLine==='all'||d.required_line_ids.includes(activeLine)),transfers=DATA.stations.filter(s=>s.line_ids.filter(id=>lineById[id]?.line_type==='cross_domain').length>1);const overlap=transfers.length?`辨識到 ${transfers.length} 門共用主課；彩色能力線會在這些轉乘站交會。`:'目前主路徑沒有辨識到跨能力共用課程，因此能力線不會為了視覺效果刻意交會。';box.innerHTML=`<h3>${activeLine==='all'?'職涯目的地':esc(lineById[activeLine]?.name)}</h3><div class="overlap-note"><b>能力重疊怎麼看</b><br>${esc(overlap)}</div><p>選擇職涯後，圖上會同時高亮它需要的核心與支援
