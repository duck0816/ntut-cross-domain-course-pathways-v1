    body+=`<g class="station ${transfer?'transfer':''} ${s.display_role==='gap'?'gap':''} ${dim?'dim':''}" data-station="${esc(s.station_id)}" transform="translate(${p.x},${p.y})">${transfer?'<rect class="transfer-ring" x="-23" y="-23" width="46" height="46" rx="11"/>':''}${dots}<rect class="station-box" x="-18" y="-18" width="36" height="36" rx="8" stroke="${color}"/><text class="term" text-anchor="middle" y="3">${esc(s.position?.label||'待定')}</text><text class="name" text-anchor="middle" y="35">${esc(shorten(s.name_zh,11))}</text><text class="meta" text-anchor="middle" y="49">${esc(shorten(s.department_names?.[0]||'能力缺口',10))}</text>${transfer?`<text class="transfer-note" text-anchor="middle" y="63">轉乘 ${cross.length} 線</text>`:''}${warn?'<text class="warning-mark" x="-6" y="7">!</text>':''}</g>`;
  });
  l.lines.filter(line=>line.line_type==='cross_domain').forEach(line=>{
    const meta=l.lineLayouts[line.line_id],dim=activeIds&&!activeIds.has(line.line_id),related=destinations.filter(d=>d.required_line_ids.includes(line.line_id)),primary=destinations.filter(d=>d.primary_line_id===line.line_id),y=meta.laneY;
    body+=`<g class="terminal ${dim?'dim':''}" data-line="${esc(line.line_id)}" transform="translate(1330,${y})"><circle r="16" stroke="${line.color}"/><text class="count" text-anchor="middle" y="34">${related.length} 職涯</text></g>`;
    const shown=primary.slice(0,1);shown.forEach(d=>{const active=activeDestination?.destination_id===d.destination_id;body+=`<g class="destination-node ${active?'active':''} ${dim?'dim':''}" data-destination="${esc(d.destination_id)}" transform="translate(1370,${y-16})"><rect width="310" height="31" rx="15"/><text x="155" y="20" text-anchor="middle">${esc(shorten(d.title,23))}</text></g>`});

  });

  svg.querySelectorAll('[data-station]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectedStation=stationById[el.dataset.station];activeDestination=null;renderDetail();openDrawer()});

  svg.querySelectorAll('[data-destination]').forEach(el=>el.onclick=e=>{e.stopPropagation();activeDestination=DATA.destinations.find(d=>d.destination_id===el.dataset.destination);activeLine='all';$('#line-select').value='all';selectedStation=null;viewBox=null;renderDestination(activeDestination);draw();openDrawer()});
  const transfers=l.stations.filter(s=>s.line_ids.filter(id=>l.lineIds.has(id)&&lineById[id]?.line_type==='cross_domain').length>1).length;
  $('#map-caption').textContent=`${l.lines.length-1} 條能力線 · ${l.stations.length} 個課程站 · ${transfers} 個轉乘站`;$('#side-summary').textContent='點課程、彩色線路或職涯標籤即可查看；按 Esc 可關閉。';
}
function Counter(items){const out={};items.forEach(x=>out[x]=(out[x]||0)+1);return out}function shorten(v,n){v=String(v||'');return v.length>n?v.slice(0,n-1)+'…':v}
function renderDetail(){const box=$('#detail');if(selectedStation){const s=selectedStation,lines=s.line_ids.map(id=>lineById[id]?.name).filter(Boolean),crossLines=s.line_ids.filter(id=>lineById[id]?.line_type==='cross_domain'),deps=DATA.dependencies.filter(e=>e.from_station_id===s.station_id||e.to_station_id===s.station_id),alts=DATA.alternatives.filter(a=>s.line_ids.includes(a.scoped_skill_id));box.innerHTML=`<h3>${esc(s.name_zh)}</h3><div class="tags"><span class="tag">${esc(s.course_code||'課程缺口')}</span><span class="tag">${esc(s.credits??'—')} 學分</span><span class="tag">${esc(s.position?.label||'位置待確認')}</span>${crossLines.length>1?'<span class="tag">共用課程／轉乘站</span>':''}</div><h4>開課與能力</h4><p>${esc((s.department_names||[]).join('／')||'目前沒有對應課程')}<br>${esc(lines.join('、'))}</p><h4>位置來源</h4><p>${esc(s.position?.source_label||'位置待確認')} · ${esc(s.position?.status||'未解析')}<br>最近開課：${esc(s.availability?.latest_term||'未觀察')}</p><h4>被選入的理由</h4><ul>${(s.selection_reasons||[]).slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>由先備閉包納入。</li>'}</ul><h4>先備關係</h4><ul>${deps.map(e=>`<li>${esc(stationById[e.from_station_id]?.name_zh)} → ${esc(stationById[e.to_station_id]?.name_zh)}｜${esc(relationName(e.relation))}${e.timing_status==='reverse_observed_position'?'｜位置反向':''}</li>`).join('')||'<li>目前沒有辨識到相鄰先備。</li>'}</ul><h4>同能力線替代課</h4><ul>${alts.slice(0,8).map(a=>`<li>${esc(a.name_zh)}（${esc(a.department_name)}）</li>`).join('')||'<li>目前沒有另列替代課。</li>'}</ul>`;return}const jobs=DATA.destinations.filter(sourceMatch).filter(d=>activeLine==='all'||d.required_line_ids.includes(activeLine)),transfers=DATA.stations.filter(s=>s.line_ids.filter(id=>lineById[id]?.line_type==='cross_domain').length>1);const overlap=transfers.length?`辨識到 ${transfers.length} 門共用主課；彩色能力線會在這些轉乘站交會。`:'目前主路徑沒有辨識到跨能力共用課程，因此能力線不會為了視覺效果刻意交會。';box.innerHTML=`<h3>${activeLine==='all'?'職涯目的地':esc(lineById[activeLine]?.name)}</h3><div class="overlap-note"><b>能力重疊怎麼看</b><br>${esc(overlap)}</div><p>選擇職涯後，圖上會同時高亮它需要的核心與支援 function renderDestination(d){const box=$('#detail');const names=d.required_line_ids.map(id=>lineById[id]?.name).filter(Boolean);box.innerHTML=`<h3>${esc(d.title)}</h3><div class="tags"><span class="tag">${d.has_104_market_evidence?'104 市場已觀察':'CIP–SOC 探索'}</span><span class="tag">${esc(d.career_stage_label||'職涯階段待確認')}</span></div><h4>主要能力線</h4><p>${esc(lineById[d.primary_line_id]?.name)}</p><h4>還需轉乘</h4><ul>${names.slice(1).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>目前沒有其他能力線。</li>'}</ul><h4>104 職稱</h4><p>${esc((d.market_job_titles_104||[]).join('、')||'目前 104 前十職務未觀察')}</p><h4>O*NET 職業</h4><ul>${d.occupations.slice(0,10).map(o=>`<li>${esc(o.title)}｜${esc(o.soc)}</li>`).join('')}</ul><button class="job" id="back-jobs" type="button">返回職涯列表</button>`;$('#back-jobs').onclick=()=>{activeDestination=null;renderDetail();draw()}}
function relationName(v){return({official_prerequisite:'正式先修',official_sequence:'官方課程順序',explicit_learning_prerequisite:'明文學習先備',recommended_knowledge_prerequisite:'建議知識先備'})[v]||v}
function zoom(f){const svg=$('#metro-svg'),b=svg.viewBox.baseVal;if(!b.width)return;const nw=b.width*f,nh=b.height*f;viewBox={x:b.x+(b.width-nw)/2,y:b.y+(b.height-nh)/2,w:nw,h:nh};draw()}
function bindPanZoom(){const host=$('#map-scroll'),svg=$('#metro-svg'),interactive='[data-station],[data-line],[data-destination],[data-more-line]';host.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest?.(interactive))return;const b=svg.viewBox.baseVal;drag={x:e.clientX,y:e.clientY,vx:b.x,vy:b.y,w:b.width,h:b.height};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const rect=svg.getBoundingClientRect();viewBox={x:drag.vx-(e.clientX-drag.x)*drag.w/rect.width,y:drag.vy-(e.clientY-drag.y)*drag.h/rect.height,w:drag.w,h:drag.h};svg.setAttribute('viewBox',`${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`)});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null)}
