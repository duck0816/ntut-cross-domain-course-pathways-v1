on"><div class="section-title"><h3>能力與課程缺口</h3><span>課程覆蓋率只表示已辨識能力有候選課，不是職業資格或能力完成率</span></div><div class="gap-list">${gaps||'<div class="gap-item" style="background:var(--teal-soft);color:#17645d">目前各項能力都有本科完整候選或跨系候選；仍須人工查 syllabus、作業與評量深度。</div>'}</div></section><div class="links"><a href="pathways.json">下載完整 JSON</a><a href="../../course_relationship_foundation/index.html">查看全校課程關聯底圖</a><span>本頁是可追溯的候選分析，不是職業資格認證。</span></div>`;
  document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selected=b.dataset.course;renderDetailV2(r)});
  if(!selected||!(r.timeline_nodes||[]).some(n=>n.course_code===selected))selected=(r.timeline_nodes||[]).find(n=>n.node_type==='external_skill_course')?.course_code||r.timeline_nodes?.[0]?.course_code;
