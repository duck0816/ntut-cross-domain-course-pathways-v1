const list=document.querySelector('#departments'),detail=document.querySelector('#detail');let selected='applied_english';

function draw(){const d=DATA.departments.find(x=>x.analysis_id===selected);const isEnglish=d.analysis_id==='applied_english';const generated=d.configuration_status==='pilot_generated';const status=statusOf(d);const passed=(isEnglish&&DATA.parity.full_parity)||generated;detail.innerHTML=`
<span class="status ${passed?'':'pending'}">${esc(status)}</span><h2 style="font-size:34px;margin-top:12px">${esc(d.display_name)}</h2>
<p style="color:var(--muted)">104 分析名：${esc(d.name_104)}｜開課責任單位：${d.owner_department_ids.map(esc).join('、')}｜${d.unit_type==='program_family'?'跨系學士班群':'單一系所'}</p>
${isEnglish?`<div class="warning ${passed?'':'blocked'}"><b>${passed?'V1.1 完整性檢查已通過':'V1.1 完整性檢查未通過'}</b><br>V1.1 驗證識別：<code>${esc(DATA.parity.replay_canonical_sha256||'尚未執行')}</code><br>${esc(DATA.parity.next_action||'')}<br>${d.metro_output_path?`<a href="${esc(d.metro_output_path)}">開啟課程捷運圖</a><br>`:''}<a href="${esc(d.output_path)}">開啟原路徑 Explorer</a></div>`:generated?`<div class="warning"><b>${d.metro_output_path?'路徑與捷運圖已產生':'試跑版已產生'}</b><br>104 路徑 ${d.routes_from_104||0} 條；CIP–SOC 補充 ${d.routes_from_cip_only||0} 條。<br>${d.metro_output_path?`<a href="${esc(d.metro_output_path)}">開啟課程捷運圖</a><br>`:''}<a href="${esc(d.output_path)}">開啟原路徑 Explorer</a></div>`:`<div class="warning"><b>尚未產生路徑</b><br>需先完成此系的職稱別名、CIP 範圍、能力中介層與本系底座能力草稿，並保留 AI／人工來源標記。</div>`}
